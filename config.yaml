name: GitHub Actions Runner
version: "1.8.1"
slug: github_actions_runner
description: Self-hosted GitHub Actions runner for Home Assistant
url: https://github.com/skille/home-assistant-github-runner-add-on
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

init: false
startup: services
boot: auto

# Nodig voor WireGuard: netwerkinterfaces zoals wg0 kunnen aanmaken.
privileged:
  - NET_ADMIN

# Nodig voor /dev/net/tun, zodat WireGuard een tunnel-interface kan gebruiken.
devices:
  - /dev/net/tun

uart: true
usb: true

hassio_api: true
hassio_role: default

panel_icon: mdi:github

map:
  - timezone:ro
  - share:rw

options:
  repo_url: ""
  runner_token: ""
  runner_name: ""
  runner_labels: ""
  debug_logging: false

schema:
  repo_url: str
  runner_token: str
  runner_name: str?
  runner_labels: str?
  debug_logging: bool
